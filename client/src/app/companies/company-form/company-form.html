<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h2>{{ company() ? 'Edit company' : 'Add a company' }}</h2>

  <div class="field">
    <label for="name">Company name</label>
    <input
      id="name"
      type="text"
      formControlName="name"
      autocomplete="organization"
      placeholder="Acme Tools Ltd"
      aria-describedby="name-error"
      [attr.aria-invalid]="fieldError('name') ? true : null"
    />
    @if (fieldError('name'); as message) {
      <p id="name-error" class="field-error">{{ message }}</p>
    }
  </div>

  <div class="field">
    <label for="websiteUrl">Website URL</label>
    <input
      id="websiteUrl"
      type="url"
      formControlName="websiteUrl"
      autocomplete="url"
      placeholder="https://www.acme-tools.com"
      aria-describedby="websiteUrl-error"
      [attr.aria-invalid]="fieldError('websiteUrl') ? true : null"
    />
    @if (fieldError('websiteUrl'); as message) {
      <p id="websiteUrl-error" class="field-error">{{ message }}</p>
    }
  </div>

  @if (formError(); as message) {
    <p class="notice error" role="alert">{{ message }}</p>
  }

  <div class="actions">
    <button type="submit" class="primary" [disabled]="saving()">
      {{ saving() ? 'Saving…' : company() ? 'Save changes' : 'Add company' }}
    </button>
    @if (company()) {
      <button type="button" (click)="cancel()">Cancel</button>
    }
  </div>
</form>
